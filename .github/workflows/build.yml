name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release -warnaserror

  # Pushing a tag such as v0.1.0 publishes a GitHub release with two downloads.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          # Small download: needs the .NET 10 Desktop Runtime.
          dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:Version=$version -o out/small
          # Standalone download: runs without installing anything.
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=$version -o out/standalone
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/small/PrioritySidebar.exe "dist/PrioritySidebar-$version-win-x64.exe"
          Copy-Item out/standalone/PrioritySidebar.exe "dist/PrioritySidebar-$version-win-x64-standalone.exe"
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create $env:TAG (Get-ChildItem dist).FullName --title "Priority Sidebar $env:TAG" --generate-notes
